name: CI-CD-Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    # el proyecto vive en frontend/, no en la raiz del repositorio
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout
      - name: Checkout codigo
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias
      - name: Install deps
        run: npm ci

      # 4. Analisis estatico
      - name: Lint
        run: npm run lint

      # 5. Pruebas unitarias
      # si falla -> pipeline se detiene
      - name: Test
        run: npm test

      # 6. Build
      - name: Build
        run: npm run build

      # 7. Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: frontend/dist/
