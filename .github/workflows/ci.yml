name: CI-CD-Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    # el proyecto vive en frontend/, no en la raiz del repositorio
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout
      - name: Checkout codigo
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias
      - name: Install deps
        run: npm ci

      # 4. Analisis estatico
      - name: Lint
        run: npm run lint

      # 5. Pruebas unitarias
      # si falla -> pipeline se detiene
      - name: Test
        run: npm test

      # 6. Build
      - name: Build
        run: npm run build

      # 7. Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: frontend/dist/

  # 8. Deploy a GitHub Pages (solo si el job build paso)
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      # el sitio queda en usuario.github.io/Trazo/, no en la raiz
      - name: Build para GitHub Pages
        run: npx vite build --base=/Trazo/

      # la SPA maneja sus rutas, Pages responde 404 al recargar sin este archivo
      - name: Copiar index.html como 404.html
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: auto

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
